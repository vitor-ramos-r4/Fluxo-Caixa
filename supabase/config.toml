# Configuração da CLI do Supabase.
# Necessário apenas se você for usar `supabase link` / `supabase db push`.
# O projeto também funciona aplicando as migrations manualmente pelo SQL Editor.

project_id = "fluxo-caixa"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
# Confirmação por e-mail desligada no ambiente local para agilizar os testes.
enable_confirmations = false

[storage]
enabled = false
